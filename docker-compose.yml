services:
  # ── Database ──
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: threatintel
      POSTGRES_PASSWORD: threatintel
      POSTGRES_DB: threatintel
      PGDATA: /var/lib/postgresql/data/18/docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (queue + pub/sub) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ──
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://threatintel:threatintel@postgres:5432/threatintel
      DATABASE_SYNC_URL: postgresql://threatintel:threatintel@postgres:5432/threatintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "opencti.siembiot.expertware.net:172.20.30.16"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./backend:/app
      - artifacts:/app/artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    restart: unless-stopped
    shm_size: '2gb'
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://threatintel:threatintel@postgres:5432/threatintel
      DATABASE_SYNC_URL: postgresql://threatintel:threatintel@postgres:5432/threatintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "opencti.siembiot.expertware.net:172.20.30.16"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - artifacts:/app/artifacts
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # ── Celery Beat (scheduler) ──
  beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://threatintel:threatintel@postgres:5432/threatintel
      DATABASE_SYNC_URL: postgresql://threatintel:threatintel@postgres:5432/threatintel
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        API_PROXY_TARGET: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  artifacts:
